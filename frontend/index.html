<!DOCTYPE html>
<html lang="ja" data-theme="system">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="漸進性過負荷に基づいて重量を提案する筋トレ記録アプリ">

<link rel="stylesheet" href="./css/style.css">
<script>
  /* テーマのちらつき防止：CSS適用前に保存済みの設定を反映する */

    var t = localStorage.getItem('liftlog.theme') || 'system';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>

<header class="md-top-app-bar" id="topBar">

  <h1 class="md-top-app-bar__headline" id="screenTitle">LiftLog</h1>
  <span id="netState" class="md-chip md-chip--static md-label-medium">未接続</span>
</header>

<main id="view" class="md-pane"></main>

<nav class="md-navigation-bar" aria-label="メインナビゲーション">
  <a class="md-navigation-bar__item" data-tab="home" href="#/home">
    <span class="md-navigation-bar__indicator md-state"><svg class="icon"><use href="#i-play"/></svg></span>

  </a>
  <a class="md-navigation-bar__item" data-tab="dashboard" href="#/dashboard">

  <a class="md-navigation-bar__item" data-tab="guides" href="#/guides">

</nav>

<div id="scrim" class="md-scrim" hidden>
  <div class="md-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="md-sheet__handle"></div>
    <button class="md-icon-button md-state md-sheet__close" data-close="1" aria-label="閉じる">
      <svg class="icon"><use href="#i-close"/></svg>
    </button>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="snackbarHost" class="md-snackbar-host" role="status" aria-live="polite"></div>

<div id="loading" class="md-loading" hidden>
  <div class="md-loading__spinner"></div>
  <div class="md-label-large" style="color:var(--md-sys-color-on-surface)">通信中…</div>
</div>
